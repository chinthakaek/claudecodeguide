<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="A practical beginner's guide to Claude Code, Anthropic's terminal-based AI coding assistant: setup, commands, memory, skills, subagents, hooks, and best practices.">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="Setup, commands, memory, skills, subagents, hooks, and best practices for Claude Code.">
<meta property="og:type" content="article">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<style>
  :root {
    --bg: #faf9f6; --panel: #ffffff; --text: #1f1e1b; --muted: #6b6860;
    --border: #e4e1d8; --accent: #c4613f; --accent-soft: #f6e7e0;
    --code-bg: #f2f0ea; --pre-bg: #1e1d1a; --pre-text: #ece9e1;
    --callout-bg: #fbf3e6; --callout-border: #d9a54a; --row-alt: #faf8f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917; --panel: #22211e; --text: #e9e6de; --muted: #a29e93;
      --border: #3a3833; --accent: #e08a68; --accent-soft: #3a2a23;
      --code-bg: #2d2b27; --pre-bg: #121110; --pre-text: #ece9e1;
      --callout-bg: #2e2820; --callout-border: #b88a3a; --row-alt: #26241f;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 20px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }
  nav.sidebar {
    position: sticky; top: 0; align-self: flex-start;
    width: 290px; flex-shrink: 0; height: 100vh; overflow-y: auto;
    padding: 28px 18px; border-right: 1px solid var(--border); background: var(--panel);
  }
  nav.sidebar .brand { font-weight: 700; font-size: 15px; margin: 0 0 4px 8px; }
  nav.sidebar .sub { font-size: 12px; color: var(--muted); margin: 0 0 18px 8px; }
  nav.sidebar ul { list-style: none; margin: 0; padding: 0; }
  nav.sidebar li a {
    display: block; padding: 5px 8px; border-radius: 6px;
    color: var(--text); text-decoration: none; font-size: 14px;
  }
  nav.sidebar li.d1 a { padding-left: 24px; font-size: 13px; color: var(--muted); }
  nav.sidebar li a:hover { background: var(--accent-soft); }
  nav.sidebar li a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { flex: 1; min-width: 0; padding: 40px 56px 96px; }
  article { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 12px; }
  h2 { font-size: 1.6rem; margin: 56px 0 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  h3 { font-size: 1.25rem; margin: 36px 0 12px; }
  h4 { font-size: 1.05rem; margin: 26px 0 10px; color: var(--accent); }
  a { color: var(--accent); }
  hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em; background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
  }
  pre {
    position: relative; background: var(--pre-bg); color: var(--pre-text);
    padding: 16px 18px; border-radius: 10px; overflow-x: auto; line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: 13.5px; color: inherit; }
  .copy-btn {
    position: absolute; top: 8px; right: 8px; font-size: 12px;
    background: rgba(255,255,255,0.1); color: #ddd; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; padding: 3px 9px; cursor: pointer; opacity: 0; transition: opacity .15s;
  }
  pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }
  .table-wrap { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; background: var(--panel); }
  th, td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); font-weight: 600; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  blockquote {
    margin: 18px 0; padding: 12px 16px; background: var(--callout-bg);
    border-left: 4px solid var(--callout-border); border-radius: 0 8px 8px 0;
  }
  blockquote p { margin: 0; }
  footer.site-footer {
    margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .menu-toggle { display: none; }
  .to-top {
    position: fixed; right: 22px; bottom: 22px; width: 42px; height: 42px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none; font-size: 18px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .to-top.show { opacity: 1; pointer-events: auto; }
  @media (max-width: 900px) {
    .layout { display: block; }
    nav.sidebar {
      position: fixed; z-index: 10; left: 0; top: 0; transform: translateX(-100%);
      transition: transform .2s; box-shadow: 2px 0 12px rgba(0,0,0,.2);
    }
    nav.sidebar.open { transform: none; }
    .menu-toggle {
      display: block; position: fixed; z-index: 11; top: 12px; left: 12px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 7px 12px; font-size: 15px; cursor: pointer;
    }
    main { padding: 64px 20px 80px; }
  }
  @media print {
    nav.sidebar, .menu-toggle, .to-top, .copy-btn { display: none !important; }
    main { padding: 0; }
    pre { white-space: pre-wrap; }
  }
</style>
</head>
<body>
<button class="menu-toggle" aria-label="Toggle navigation">☰ Contents</button>
<div class="layout">
  <nav class="sidebar" aria-label="Table of contents">
    <p class="brand">Claude Code Guide</p>
    <p class="sub">Beginner's guide &amp; best practices</p>
    {{NAV}}
  </nav>
  <main><article>
{{BODY}}
    <footer class="site-footer">
      <p>Community guide. Not an official Anthropic publication, and not affiliated with or endorsed by Anthropic.
      Claude Code changes quickly, so check the <a href="https://docs.claude.com/en/docs/claude-code/overview">official docs</a> for the latest.
      Last updated {{UPDATED}}.</p>
    </footer>
  </article></main>
</div>
<button class="to-top" aria-label="Back to top">↑</button>
<script>
  // Wrap tables for horizontal scroll on small screens
  document.querySelectorAll('article table').forEach(t => {
    const w = document.createElement('div'); w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  // Copy buttons on code blocks
  document.querySelectorAll('article pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'copy-btn'; b.textContent = 'Copy';
    b.onclick = () => navigator.clipboard.writeText(pre.innerText.replace(/Copy(ied!)?$/, '').trimEnd())
      .then(() => { b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Copy', 1500); });
    pre.appendChild(b);
  });
  // Mobile menu
  const sidebar = document.querySelector('nav.sidebar');
  document.querySelector('.menu-toggle').onclick = () => sidebar.classList.toggle('open');
  sidebar.querySelectorAll('a').forEach(a => a.onclick = () => sidebar.classList.remove('open'));
  // Highlight current section in sidebar
  const links = [...sidebar.querySelectorAll('a')];
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  const topBtn = document.querySelector('.to-top');
  topBtn.onclick = () => window.scrollTo({ top: 0 });
  const onScroll = () => {
    let current = targets[0];
    for (const t of targets) if (t.getBoundingClientRect().top < 120) current = t;
    links.forEach(a => a.classList.toggle('active', current && a.getAttribute('href') === '#' + current.id));
    topBtn.classList.toggle('show', window.scrollY > 600);
  };
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
</script>
</body>
</html>
